<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <filter id="glow1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="bg1" cx="50%" cy="45%" r="55%">
      <stop offset="0%"   stop-color="#3b82f6" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0a0a0b" stop-opacity="1"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="400" height="400" rx="16" fill="#0a0a0b"/>
  <rect width="400" height="400" rx="16" fill="url(#bg1)"/>

  <!-- border -->
  <rect x="2" y="2" width="396" height="396" rx="15" fill="none"
        stroke="#3b82f6" stroke-width="2" opacity="0.5"/>

  <!-- icon -->
  
    <!-- horizon ring -->
    <ellipse cx="200" cy="230" rx="90" ry="22" fill="none" stroke="#3b82f6" stroke-width="4" opacity="0.35"/>
    <!-- rocket body -->
    <path d="M200 90 L224 170 L200 158 L176 170 Z" fill="#3b82f6"/>
    <!-- rocket fins -->
    <path d="M176 170 L158 195 L176 188 Z" fill="#3b82f6" opacity="0.7"/>
    <path d="M224 170 L242 195 L224 188 Z" fill="#3b82f6" opacity="0.7"/>
    <!-- exhaust -->
    <path d="M192 170 Q200 200 208 170" fill="#3b82f6" opacity="0.4"/>
    <!-- nose tip star -->
    <circle cx="200" cy="88" r="5" fill="#3b82f6"/>
    <!-- speed lines -->
    <line x1="155" y1="130" x2="135" y2="125" stroke="#3b82f6" stroke-width="2.5" opacity="0.5" stroke-linecap="round"/>
    <line x1="150" y1="150" x2="128" y2="148" stroke="#3b82f6" stroke-width="2" opacity="0.35" stroke-linecap="round"/>
    <line x1="245" y1="130" x2="265" y2="125" stroke="#3b82f6" stroke-width="2.5" opacity="0.5" stroke-linecap="round"/>
    <line x1="250" y1="150" x2="272" y2="148" stroke="#3b82f6" stroke-width="2" opacity="0.35" stroke-linecap="round"/>


  <!-- phase number pill -->
  <rect x="24" y="24" width="60" height="28" rx="5"
        fill="#3b82f6" opacity="0.15"/>
  <rect x="24" y="24" width="60" height="28" rx="5"
        fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.6"/>
  <text x="54" y="43" font-family="'IBM Plex Mono', 'Courier New', monospace"
        font-size="13" font-weight="600" fill="#3b82f6" text-anchor="middle"
        letter-spacing="1">P01</text>

  <!-- bottom label band -->
  <rect x="0" y="315" width="400" height="85" rx="0"
        fill="#13131c" opacity="0.9"/>
  <rect x="0" y="315" width="400" height="2" fill="#3b82f6" opacity="0.4"/>
  <rect x="0" y="384" width="400" height="16" rx="0" fill="#0a0a0b"/>
  <rect x="0" y="384" width="400" height="16" rx="16" fill="#13131c" opacity="0.9"/>

  <!-- phase name -->
  <text x="24" y="347" font-family="'IBM Plex Sans', 'Arial', sans-serif"
        font-size="19" font-weight="700" fill="#3b82f6" letter-spacing="-0.3">Brand Launch</text>

  <!-- weeks label -->
  <text x="24" y="369" font-family="'IBM Plex Mono', 'Courier New', monospace"
        font-size="12" fill="#6b7280" letter-spacing="0.5">Weeks 1–3</text>

  <!-- corner accent -->
  <circle cx="376" cy="24" r="16" fill="#3b82f6" opacity="0.12"/>
  <text x="376" y="29" font-family="'IBM Plex Sans', sans-serif"
        font-size="18" text-anchor="middle" fill="#3b82f6" opacity="0.8">1</text>
</svg>