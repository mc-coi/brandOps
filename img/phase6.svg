<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <filter id="glow6" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="bg6" cx="50%" cy="45%" r="55%">
      <stop offset="0%"   stop-color="#a855f7" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0a0a0b" stop-opacity="1"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="400" height="400" rx="16" fill="#0a0a0b"/>
  <rect width="400" height="400" rx="16" fill="url(#bg6)"/>

  <!-- border -->
  <rect x="2" y="2" width="396" height="396" rx="15" fill="none"
        stroke="#a855f7" stroke-width="2" opacity="0.5"/>

  <!-- icon -->
  
    <!-- outer arc -->
    <path d="M 186.5 108.2 A 78 78 0 1 1 186.5 261.8" fill="none" stroke="#a855f7" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
    <!-- inner arc (opposite direction) -->
    <path d="M 213.5 261.8 A 78 78 0 0 1 186.5 108.2" fill="none" stroke="#a855f7" stroke-width="10" stroke-linecap="round" opacity="0.5"/>
    <!-- arrowhead top-right -->
    <polygon points="278,148  263,135  262,160" fill="#a855f7" opacity="0.9"/>
    <!-- arrowhead bottom-left -->
    <polygon points="122,222  137,235  138,210" fill="#a855f7" opacity="0.5"/>
    <!-- center core -->
    <circle cx="200" cy="185" r="22" fill="#a855f7"/>
    <circle cx="200" cy="185" r="12" fill="#0a0a0b"/>
    <circle cx="200" cy="185" r="5"  fill="#a855f7"/>


  <!-- phase number pill -->
  <rect x="24" y="24" width="60" height="28" rx="5"
        fill="#a855f7" opacity="0.15"/>
  <rect x="24" y="24" width="60" height="28" rx="5"
        fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.6"/>
  <text x="54" y="43" font-family="'IBM Plex Mono', 'Courier New', monospace"
        font-size="13" font-weight="600" fill="#a855f7" text-anchor="middle"
        letter-spacing="1">P06</text>

  <!-- bottom label band -->
  <rect x="0" y="315" width="400" height="85" rx="0"
        fill="#13131c" opacity="0.9"/>
  <rect x="0" y="315" width="400" height="2" fill="#a855f7" opacity="0.4"/>
  <rect x="0" y="384" width="400" height="16" rx="0" fill="#0a0a0b"/>
  <rect x="0" y="384" width="400" height="16" rx="16" fill="#13131c" opacity="0.9"/>

  <!-- phase name -->
  <text x="24" y="347" font-family="'IBM Plex Sans', 'Arial', sans-serif"
        font-size="19" font-weight="700" fill="#a855f7" letter-spacing="-0.3">Rebrand or Die</text>

  <!-- weeks label -->
  <text x="24" y="369" font-family="'IBM Plex Mono', 'Courier New', monospace"
        font-size="12" fill="#6b7280" letter-spacing="0.5">Weeks 16–18</text>

  <!-- corner accent -->
  <circle cx="376" cy="24" r="16" fill="#a855f7" opacity="0.12"/>
  <text x="376" y="29" font-family="'IBM Plex Sans', sans-serif"
        font-size="18" text-anchor="middle" fill="#a855f7" opacity="0.8">6</text>
</svg>