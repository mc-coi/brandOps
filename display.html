<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrandOps — Class Display</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
:root {
  --bg:#07070a;--bg2:#0f0f14;--bg3:#14141b;--bg4:#1a1a24;
  --border:#252530;--amber:#f5a623;--amber2:#d4891a;
  --green:#22c55e;--red:#ef4444;--yellow:#eab308;
  --muted:#6b7280;--text:#e8e3d8;--text2:#9d97a0;
  --serif:'Playfair Display',serif;--mono:'IBM Plex Mono',monospace;
  --sans:'IBM Plex Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);}
body{display:flex;flex-direction:column;font-family:var(--sans);color:var(--text);}

/* ── Stock ticker ── */
.ticker{height:36px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;overflow:hidden;flex-shrink:0;position:relative;}
.ticker::before,.ticker::after{content:'';position:absolute;top:0;bottom:0;width:48px;z-index:2;}
.ticker::before{left:0;background:linear-gradient(90deg,var(--bg2),transparent);}
.ticker::after{right:0;background:linear-gradient(270deg,var(--bg2),transparent);}
.ticker-inner{display:flex;gap:0;white-space:nowrap;animation:ticker 30s linear infinite;}
.ticker-inner:hover{animation-play-state:paused;}
@keyframes ticker{from{transform:translateX(0);}to{transform:translateX(-50%);}};
.tick-item{display:inline-flex;align-items:center;gap:8px;padding:0 24px;font-family:var(--mono);font-size:12px;border-right:1px solid var(--border);}
.tick-name{color:var(--text2);}
.tick-price{font-weight:600;}
.tick-arrow{font-size:10px;}
.tick-dot{width:4px;height:4px;border-radius:50%;background:var(--amber);flex-shrink:0;}

/* ── Main content area ── */
.main{flex:1;display:grid;grid-template-columns:1fr 340px;overflow:hidden;}

/* ── Center stage (rotating cards) ── */
.stage{position:relative;overflow:hidden;border-right:1px solid var(--border);}
.slide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:40px;opacity:0;transition:opacity 0.8s ease;pointer-events:none;}
.slide.active{opacity:1;pointer-events:auto;}

/* ── Brand card slide ── */
.brand-card{width:100%;max-width:700px;background:var(--bg3);border:1px solid var(--border);padding:40px;}
.bc-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:28px;}
.bc-name{font-family:var(--serif);font-size:48px;font-weight:900;line-height:1;}
.bc-meta{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:6px;}
.bc-score{text-align:right;}
.bc-score-val{font-family:var(--serif);font-size:56px;font-weight:900;color:var(--amber);line-height:1;}
.bc-score-label{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;}
.bc-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px;}
.bc-stat{background:var(--bg4);padding:14px;}
.bc-stat-label{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
.bc-stat-val{font-family:var(--serif);font-size:28px;font-weight:900;}
.bc-stat-bar{height:3px;background:var(--bg);margin-top:6px;border-radius:2px;}
.bc-stat-fill{height:100%;border-radius:2px;}
.bc-bottom{display:flex;justify-content:space-between;align-items:center;}
.bc-stock{font-family:var(--mono);font-size:14px;}
.bc-rank{font-family:var(--mono);font-size:12px;color:var(--muted);}

/* ── Event slide ── */
.event-card-big{width:100%;max-width:600px;background:var(--bg3);border:1px solid var(--border);padding:44px;}
.ec-deck{font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--amber);margin-bottom:12px;}
.ec-title{font-family:var(--serif);font-size:40px;font-weight:900;line-height:1.1;margin-bottom:16px;}
.ec-story{font-family:var(--sans);font-size:16px;line-height:1.7;color:var(--text2);margin-bottom:20px;}
.ec-team{font-family:var(--mono);font-size:12px;color:var(--amber);}
.ec-effects{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.ec-pill{font-family:var(--mono);font-size:11px;padding:3px 10px;border-radius:2px;}
.ec-pos{background:rgba(34,197,94,.15);color:var(--green);}
.ec-neg{background:rgba(239,68,68,.15);color:var(--red);}

/* ── Phase slide ── */
.phase-slide-inner{text-align:center;padding:60px;}
.ps-icon{width:160px;height:160px;margin:0 auto 20px;display:block;border-radius:16px;}
.ps-emoji{font-size:80px;margin-bottom:20px;}
.ps-label{font-family:var(--mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
.ps-name{font-family:var(--serif);font-size:56px;font-weight:900;margin-bottom:16px;}
.ps-desc{font-family:var(--sans);font-size:18px;line-height:1.6;color:var(--text2);max-width:560px;margin:0 auto;}

/* ── Sidebar ── */
.sidebar{background:var(--bg2);display:flex;flex-direction:column;overflow:hidden;}
.sidebar-section{border-bottom:1px solid var(--border);padding:16px;}
.sidebar-title{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);margin-bottom:10px;}

/* ── Leaderboard ── */
.lb-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--border);}
.lb-row:last-child{border:none;}
.lb-rank{font-family:var(--mono);font-size:11px;color:var(--muted);width:20px;flex-shrink:0;}
.lb-name{font-family:var(--sans);font-size:13px;font-weight:500;flex:1;}
.lb-score{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--amber);}
.lb-change{font-family:var(--mono);font-size:10px;}

/* ── Market stats ── */
.market-stat{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;border-bottom:1px dotted var(--border);}
.market-stat:last-child{border:none;}
.ms-label{font-family:var(--mono);font-size:10px;color:var(--muted);}
.ms-val{font-family:var(--mono);font-size:13px;font-weight:600;}

/* ── Progress dots ── */
.dots{display:flex;gap:6px;justify-content:center;padding:10px 0;flex-shrink:0;background:var(--bg2);border-top:1px solid var(--border);}
.dot{width:6px;height:6px;border-radius:50%;background:var(--bg4);cursor:pointer;transition:background .2s;}
.dot.active{background:var(--amber);}
.dot:hover{background:var(--text2);}

/* ── Social post slide ── */
.social-slide-inner {
  width:100%;max-width:860px;
  background:#12121c;
  border:1px solid #f5a62340;
  border-radius:20px;
  padding:44px 52px;
}
.ss-platform {
  font-family:var(--mono);font-size:11px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--amber);margin-bottom:24px;
  display:flex;align-items:center;gap:8px;
}
.ss-platform::after { content:'';flex:1;height:1px;background:#f5a62330; }
.ss-header { display:flex;align-items:center;gap:18px;margin-bottom:22px; }
.ss-avatar {
  width:70px;height:70px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:36px;flex-shrink:0;
  border:2px solid #25253a;
}
.ss-name   { font-weight:700;font-size:26px; }
.ss-handle { font-family:var(--mono);font-size:16px;color:var(--text2); }
.ss-badge  {
  margin-left:auto;font-family:var(--mono);font-size:13px;
  font-weight:700;padding:5px 14px;border-radius:10px;
  text-transform:uppercase;letter-spacing:.5px;
}
.ss-text { font-size:28px;line-height:1.55;color:var(--text);margin-bottom:24px;word-break:break-word; }
.ss-image { width:100%;max-height:420px;object-fit:contain;border-radius:12px;margin-bottom:24px;display:block; }
.ss-footer {
  display:flex;align-items:center;justify-content:space-between;
  padding-top:18px;border-top:1px solid #25253a;
  font-family:var(--mono);font-size:16px;color:var(--text2);
}
.ss-actions { display:flex;gap:28px; }
/* ── Social slide comments ── */
.ss-comments { margin-bottom:20px;display:flex;flex-direction:column;gap:10px; }
.ss-cmt { display:flex;gap:12px;align-items:flex-start;background:#0e0e17;border-radius:10px;padding:10px 14px; }
.ss-cmt-av { width:34px;height:34px;border-radius:50%;background:#1e1e2a;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0; }
.ss-cmt-body { flex:1; }
.ss-cmt-name { font-size:14px;font-weight:700;margin-bottom:2px; }
.ss-cmt-handle { font-family:var(--mono);font-size:11px;color:var(--text2);margin-bottom:4px; }
.ss-cmt-text { font-size:16px;line-height:1.4;color:var(--text2); }

/* ── Sidebar event card ── */
.side-event { padding:0; }
.se-deck { font-family:var(--mono);font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin-bottom:6px; }
.se-title { font-family:var(--serif);font-size:16px;font-weight:900;line-height:1.2;margin-bottom:6px;color:var(--text); }
.se-team { font-family:var(--mono);font-size:10px;color:var(--amber);margin-bottom:6px; }
.se-effects { display:flex;gap:4px;flex-wrap:wrap; }
.se-pill { font-family:var(--mono);font-size:9px;padding:2px 7px;border-radius:2px; }

/* ── Market Dispatch slide ── */
.md-slide{width:100%;max-width:760px;background:var(--bg3);border:1px solid var(--border);padding:0;overflow:hidden;}
.md-masthead{background:var(--bg4);border-bottom:1px solid var(--border);padding:14px 28px;display:flex;align-items:baseline;justify-content:space-between;}
.md-title{font-family:var(--serif);font-size:22px;font-weight:900;letter-spacing:-.5px;color:var(--amber);}
.md-sub{font-family:var(--mono);font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);}
.md-dateline{font-family:var(--mono);font-size:9px;color:var(--muted);text-align:right;}
.md-banner{background:var(--bg2);border-bottom:1px solid var(--border);padding:8px 28px;display:flex;align-items:center;gap:12px;}
.md-phase-badge{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 10px;border-radius:2px;}
.md-week-label{font-family:var(--mono);font-size:10px;color:var(--muted);}
.md-body{display:grid;grid-template-columns:1fr 190px;gap:0;}
.md-editorial{padding:24px 28px;border-right:1px solid var(--border);}
.md-headline{font-family:var(--serif);font-size:26px;font-weight:900;line-height:1.15;margin-bottom:14px;color:var(--text);}
.md-rule{height:2px;background:var(--amber);width:40px;margin-bottom:14px;}
.md-story{font-family:var(--sans);font-size:13px;line-height:1.7;color:var(--text2);}
.md-stats{padding:20px 18px;display:flex;flex-direction:column;gap:10px;}
.md-stat-row{padding-bottom:10px;border-bottom:1px dotted var(--border);}
.md-stat-row:last-child{border:none;}
.md-stat-label{font-family:var(--mono);font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:3px;}
.md-stat-val{font-family:var(--serif);font-size:18px;font-weight:900;}

/* ── The Brandies award slide ── */
.brandies-slide{width:100%;max-width:820px;}
.brandies-eyebrow{font-family:var(--mono);font-size:11px;color:var(--amber);text-transform:uppercase;letter-spacing:.15em;margin-bottom:8px;}
.brandies-title{font-family:var(--serif);font-size:52px;font-weight:900;line-height:1;margin-bottom:4px;}
.brandies-week{font-family:var(--mono);font-size:13px;color:var(--text2);margin-bottom:30px;}
.brandies-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.award-card{background:var(--bg3);border:1px solid var(--border);border-radius:14px;padding:22px 24px;position:relative;overflow:hidden;}
.award-card::before{content:'';position:absolute;inset:0;opacity:.04;background:var(--award-color,var(--amber));pointer-events:none;}
.award-icon{font-size:30px;margin-bottom:8px;line-height:1;}
.award-cat{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.award-winner{font-size:24px;font-weight:800;color:var(--amber);line-height:1.1;margin-bottom:5px;}
.award-detail{font-family:var(--mono);font-size:11px;color:var(--text2);line-height:1.5;}

/* ── Phase transition overlay ── */
#phaseOverlay {
  display:none;position:fixed;inset:0;z-index:9999;
  align-items:center;justify-content:center;flex-direction:column;text-align:center;
  animation:ovIn .6s ease forwards;
}
@keyframes ovIn{from{opacity:0;transform:scale(1.04);}to{opacity:1;transform:scale(1);}}
@keyframes ovOut{from{opacity:1;}to{opacity:0;}}
#phaseOverlay.hiding{animation:ovOut .5s ease forwards;}
#phaseOverlay .po-emoji{font-size:100px;line-height:1;margin-bottom:20px;}
#phaseOverlay .po-icon{width:180px;height:180px;border-radius:20px;margin-bottom:20px;display:block;}
#phaseOverlay .po-label{font-family:var(--mono);font-size:14px;letter-spacing:.2em;text-transform:uppercase;opacity:.7;margin-bottom:10px;}
#phaseOverlay .po-name{font-family:var(--serif);font-size:68px;font-weight:900;line-height:1;margin-bottom:24px;}
#phaseOverlay .po-quote{font-family:var(--sans);font-size:20px;font-style:italic;opacity:.8;max-width:560px;line-height:1.6;}
</style>
</head>
<body>

<!-- Ticker -->
<div class="ticker">
  <div class="ticker-inner" id="tickerInner">
    <span style="font-family:var(--mono);font-size:11px;color:var(--muted);padding:0 24px">Loading market data…</span>
  </div>
</div>

<!-- Main -->
<div class="main">

  <!-- Stage -->
  <div class="stage" id="stage">
    <div class="slide active" id="slide-loading">
      <div style="text-align:center">
        <div style="font-family:var(--serif);font-size:40px;font-weight:900;color:var(--amber)">BrandOps</div>
        <div style="font-family:var(--mono);font-size:13px;color:var(--muted);margin-top:10px">Connecting to market…</div>
      </div>
    </div>
  </div>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-section" style="flex:1;overflow-y:auto">
      <div class="sidebar-title">Live Standings</div>
      <div id="sideLeaderboard"></div>
    </div>
    <!-- Rotating bottom panel: Market ↔ Event Cards -->
    <div class="sidebar-section" id="sideBottomPanel">
      <!-- Market view (default) -->
      <div id="sideMarketView">
        <div class="sidebar-title">Market</div>
        <div class="market-stat">
          <span class="ms-label">Week</span>
          <span class="ms-val" id="mktWeek" style="color:var(--amber)">—</span>
        </div>
        <div class="market-stat">
          <span class="ms-label">Phase</span>
          <span class="ms-val" id="mktPhase" style="font-size:11px">—</span>
        </div>
        <div class="market-stat">
          <span class="ms-label">Volatility</span>
          <span class="ms-val" id="mktVol">—</span>
        </div>
        <div class="market-stat">
          <span class="ms-label">Teams</span>
          <span class="ms-val" id="mktTeams">—</span>
        </div>
      </div>
      <!-- Event card view (hidden when no events) -->
      <div id="sideEventView" style="display:none">
        <div class="sidebar-title" id="sideEventLabel">⚡ Active Event</div>
        <div id="sideEventContent" class="side-event"></div>
      </div>
    </div>
    <div class="sidebar-section" style="display:flex;align-items:center;justify-content:space-between">
      <span style="font-family:var(--mono);font-size:9px;color:var(--muted)">
        <span style="width:6px;height:6px;background:#22c55e;border-radius:50%;display:inline-block;animation:pulse 2s ease infinite;margin-right:4px"></span>
        LIVE
      </span>
      <span style="font-family:var(--mono);font-size:9px;color:var(--muted)" id="sideTime">—</span>
    </div>
  </div>

</div>

<!-- Dots -->
<div class="dots" id="dots"></div>

<!-- Social post toast (bottom-left) -->
<div id="socialToast" style="
  position:fixed;bottom:60px;left:28px;z-index:8000;
  background:#13131c;border:1px solid #f5a62355;
  border-radius:12px;padding:16px 18px;max-width:340px;
  display:none;
  box-shadow:0 8px 32px rgba(0,0,0,0.6);
  animation:stIn .4s ease;
">
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
    <div style="font-family:var(--mono);font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:#f5a623">📣 BuzzNet</div>
    <div style="width:6px;height:6px;border-radius:50%;background:#ef4444;animation:pulse 1.5s infinite;margin-left:auto"></div>
  </div>
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
    <div id="stAvatar" style="font-size:22px;width:38px;height:38px;background:#1e1e2a;border-radius:50%;border:1px solid #252535;display:flex;align-items:center;justify-content:center;flex-shrink:0">👤</div>
    <div>
      <div id="stName"   style="font-weight:600;font-size:13px;color:#e8e3d8"></div>
      <div id="stHandle" style="font-family:var(--mono);font-size:11px;color:#6b7280"></div>
    </div>
  </div>
  <div id="stText" style="font-size:14px;line-height:1.55;color:#e8e3d8"></div>
  <div style="margin-top:10px;display:flex;gap:14px">
    <span id="stLikes" style="font-family:var(--mono);font-size:11px;color:#6b7280"></span>
    <span id="stTime"  style="font-family:var(--mono);font-size:11px;color:#4b4b6a;margin-left:auto"></span>
  </div>
</div>
<style>@keyframes stIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}</style>

<!-- Phase overlay -->
<div id="phaseOverlay">
  <img class="po-icon" id="poIcon" src="img/phase1.svg" alt="">
  <div class="po-label" id="poLabel">Phase 1 Begins</div>
  <div class="po-name"  id="poName">Brand Launch</div>
  <div class="po-quote" id="poQuote">—</div>
</div>

<style>@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}</style>

<script src="js/firebase-config.js"></script>
<script src="js/game-engine.js"></script>
<script src="js/event-cards.js"></script>
<script>
if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.database();
let seasonData = {}, teamsData = {};
let slides = [], currentSlide = 0, rotateTimer;
let lastTransitionTs = null;

const PHASE_QUOTES = [
  "Every brand starts as nothing. What you build in the next three weeks is everything.",
  "The market has no mercy for brands that aren't ready. Show us what you're made of.",
  "One hundred million people. Sixty seconds. What does your brand say to the entire world?",
  "The best advertising is the kind audiences don't even realize they're watching.",
  "The gloves are off. Go after them — or get gone.",
  "Nothing lasts forever. Rebuild. Relaunch. Prove you deserve a second chapter.",
];

const DISPATCH_CONTENT = [
  {
    headline: "New Brands Enter the Arena — Identity Is Everything",
    teaser: "The opening bell has rung on a new season. The companies that define themselves clearly in these first three weeks — with a coherent visual identity, a compelling story, and a message built for their specific audience — will carry that equity forward into the brutal middle phases.",
  },
  {
    headline: "The Honeymoon Is Over — Crises Are Hitting the Market",
    teaser: "Event cards are being drawn and volatility is climbing. The defining skill of this phase is adaptation. How a brand responds to adversity — not how it performs in calm conditions — is what separates market leaders from market victims.",
  },
  {
    headline: "Super Bowl Week: One Stage, 100 Million People",
    teaser: "The Super Bowl is the last remaining cultural moment where a brand can legitimately reach over 100 million people simultaneously. It rewards emotional storytelling over product specifications — and spectacle over information.",
  },
  {
    headline: "Product Placement Phase: The Art of Invisible Advertising",
    teaser: "Unlike a commercial — where the audience knows they're being sold to — effective product placement operates below the threshold of conscious resistance. The brand becomes part of the story, not an interruption to it.",
  },
  {
    headline: "Market War Has Begun — The Gloves Are Off",
    teaser: "Four months of market data, event history, and deliverable performance have built a clear picture of who is strong, who is struggling, and where the vulnerabilities are. Teams must now choose their weapon.",
  },
  {
    headline: "Rebrand or Die: Every Brand Faces Its Final Chapter",
    teaser: "Terminal events have fired. The brand that won you a following in Phase 1 is now a liability. What you build in the next three weeks is all that matters — and the leaderboard is still very much in play.",
  },
];

db.ref('season').on('value', s => {
  seasonData = s.val() || {};
  checkPhaseTransition();
  rebuildSlides();
  updateSidebar();
  startSidebarEventRotation();
});
db.ref('teams').on('value', s => {
  teamsData = s.val() || {};
  rebuildSlides();
  updateSidebar();
  updateTicker();
});

// ── Social posts ───────────────────────────────────────────
let socialPostsData  = [];   // all posts, newest first
let _lastSocialKey   = null;
let _socialToastTimer = null;

db.ref('social/posts').on('value', snap => {
  const raw = snap.val() || {};
  socialPostsData = Object.entries(raw)
    .map(([k, v]) => ({ ...v, _key: k }))
    .sort((a, b) => b.timestamp - a.timestamp);

  // Rebuild slides so social posts are woven in
  rebuildSlides();

  // Toast for brand-new posts only (< 30s old)
  if (!socialPostsData.length) return;
  const newest = socialPostsData[0];
  if (newest._key === _lastSocialKey) return;
  _lastSocialKey = newest._key;
  if (Date.now() - (newest.timestamp || 0) > 30000) return;

  const toast = document.getElementById('socialToast');
  document.getElementById('stAvatar').textContent = newest.avatar || '👤';
  document.getElementById('stName').textContent   = newest.displayName || '';
  document.getElementById('stHandle').textContent = newest.handle || '';
  document.getElementById('stText').textContent   = newest.text || '';
  document.getElementById('stLikes').textContent  = '❤️ ' + (newest.likes || 0).toLocaleString();
  document.getElementById('stTime').textContent   = 'just now';
  toast.style.display = 'block';
  toast.style.animation = 'none';
  requestAnimationFrame(() => { toast.style.animation = 'stIn .4s ease'; });
  clearTimeout(_socialToastTimer);
  _socialToastTimer = setTimeout(() => { toast.style.display = 'none'; }, 9000);
});

// ── Build slides ──────────────────────────────────────────────
function rebuildSlides() {
  const week   = seasonData.currentWeek || 1;
  const phase  = GameEngine.getPhase(week);
  const teams  = Object.entries(teamsData);
  if (!teams.length) return;

  const sorted = teams.map(([id,t]) => ({
    id, ...t, score: GameEngine.calcMarketScore(t.stats || {})
  })).sort((a,b) => b.score - a.score);

  const newSlides = [];

  // Phase context slide (first)
  newSlides.push({ type: 'phase', phase, week });

  // Market Dispatch editorial slide (second — right after phase)
  const phaseIdx = GAME_CONFIG.phases.indexOf(phase);
  const dispatch = DISPATCH_CONTENT[phaseIdx] || DISPATCH_CONTENT[0];
  newSlides.push({ type: 'market_dispatch', phase, week, dispatch, teams: sorted });

  // One card per brand
  sorted.forEach((t, i) => newSlides.push({ type: 'brand', team: t, rank: i + 1, total: sorted.length }));

  // Active event cards
  const events = Object.entries(seasonData.activeCards || {});
  events.forEach(([tid, cd]) => {
    const card = CardLibrary.getById(cd.cardId);
    const team = teamsData[tid];
    if (card && team) newSlides.push({ type: 'event', card, team, teamId: tid });
  });

  // The Brandies — one award slide per rotation (after brand cards)
  if (teams.length >= 2) {
    newSlides.push({ type: 'brandies', week, teams: sorted });
  }

  // Weave social post slides in — all current-week posts, shuffled, woven through the rotation
  const weekPosts = socialPostsData.filter(p => p.week === week);
  const postPool  = weekPosts.length ? weekPosts : socialPostsData.slice(0, 20); // fallback to recent if no week filter
  if (postPool.length) {
    const shuffled = postPool.slice().sort(() => Math.random() - 0.5);
    let postIdx = 0;
    const withSocial = [];
    let nonSocialCount = 0;
    for (const slide of newSlides) {
      withSocial.push(slide);
      if (slide.type === 'brand' || slide.type === 'event') {
        nonSocialCount++;
        if (nonSocialCount % 2 === 0 && postIdx < shuffled.length) {
          withSocial.push({ type: 'social', post: shuffled[postIdx++] });
        }
      }
    }
    // Drain any remaining posts at the end so all get shown
    while (postIdx < shuffled.length) {
      withSocial.push({ type: 'social', post: shuffled[postIdx++] });
    }
    slides = withSocial;
  } else {
    slides = newSlides;
  }
  renderDots();
  renderCurrentSlide();
  resetTimer();
}

// ── Brandies award data ───────────────────────────────────────
// Returns teacher-assigned data if published, otherwise auto-calc fallback
function getBrandiesAwards(week, sortedTeams) {
  const assigned = seasonData.brandies;
  if (assigned && assigned.week === week) {
    // Teacher has published for this week — use it directly
    return ['viral','points','visual','leader'].reduce((acc, key) => {
      const a = assigned[key] || {};
      acc[key] = { name: a.teamName || '—', detail: a.reason || '' };
      return acc;
    }, {});
  }

  // Auto-calc fallback
  const teams    = Object.entries(teamsData);
  const weekBrandPosts = socialPostsData.filter(p => p.week === week && p.accountType === 'brand');

  const postCount = {};
  weekBrandPosts.forEach(p => { postCount[p.teamId] = (postCount[p.teamId]||0)+1; });
  const viralId   = Object.keys(postCount).sort((a,b) => postCount[b]-postCount[a])[0];
  const viralName = viralId ? (teamsData[viralId]?.brandName||'—') : (sortedTeams[0]?.brandName||'—');

  const weekPts = {};
  teams.forEach(([tid,t]) => {
    weekPts[tid] = Object.values(t.scoreLog||{}).filter(e=>e.week===week).reduce((s,e)=>s+(e.points||0),0);
  });
  const ptsId   = Object.keys(weekPts).sort((a,b)=>weekPts[b]-weekPts[a])[0];
  const ptsName = ptsId ? (teamsData[ptsId]?.brandName||'—') : '—';

  const imgCount = {};
  weekBrandPosts.filter(p=>p.imageUrl).forEach(p=>{ imgCount[p.teamId]=(imgCount[p.teamId]||0)+1; });
  const imgId   = Object.keys(imgCount).sort((a,b)=>imgCount[b]-imgCount[a])[0];
  const imgName = imgId ? (teamsData[imgId]?.brandName||'—') : (sortedTeams[0]?.brandName||'—');

  const leader  = sortedTeams[0] || {};
  return {
    viral:  { name: viralName,            detail: postCount[viralId] ? `${postCount[viralId]} post${postCount[viralId]!==1?'s':''} this week` : 'Auto-calculated' },
    points: { name: ptsName,              detail: weekPts[ptsId]     ? `+${weekPts[ptsId]} pts this week` : 'Auto-calculated' },
    visual: { name: imgName,              detail: imgCount[imgId]    ? `${imgCount[imgId]} visual post${imgCount[imgId]!==1?'s':''}` : 'Auto-calculated' },
    leader: { name: leader.brandName||'—',detail: `Market Score: ${leader.score??'—'}` },
  };
}

// ── Sidebar event card rotation ───────────────────────────────
let _sideEventTimer = null;
let _sideEventIdx   = -1;  // -1 = showing Market, 0+ = event index

function startSidebarEventRotation() {
  clearInterval(_sideEventTimer);
  _sideEventIdx = -1;
  showSidebarMarket();

  const events = Object.entries(seasonData.activeCards || {});
  if (!events.length) return;  // No events — stay on Market

  // Cycle: Market (6s) → event 0 (6s) → event 1 (6s) → … → back to Market
  _sideEventTimer = setInterval(() => {
    const evts = Object.entries(seasonData.activeCards || {});
    if (!evts.length) { showSidebarMarket(); return; }
    _sideEventIdx = (_sideEventIdx + 1) % (evts.length + 1);
    if (_sideEventIdx === evts.length) {
      showSidebarMarket();
    } else {
      const [tid, cd] = evts[_sideEventIdx];
      const card = CardLibrary.getById(cd.cardId);
      const team = teamsData[tid];
      if (card && team) showSidebarEvent(card, team, _sideEventIdx + 1, evts.length);
      else showSidebarMarket();
    }
  }, 6000);
}

function showSidebarMarket() {
  document.getElementById('sideMarketView').style.display = '';
  document.getElementById('sideEventView').style.display  = 'none';
}

function showSidebarEvent(card, team, idx, total) {
  document.getElementById('sideMarketView').style.display = 'none';
  document.getElementById('sideEventView').style.display  = '';
  document.getElementById('sideEventLabel').textContent   = `⚡ Event ${idx} of ${total}`;
  const fx = Object.entries(card.effects || {});
  const pills = fx.map(([s, v]) =>
    `<span class="se-pill ${v > 0 ? 'ec-pos' : 'ec-neg'}">${s} ${v > 0 ? '+' : ''}${v}</span>`
  ).join('');
  document.getElementById('sideEventContent').innerHTML = `
    <div class="se-deck">${card.deck || ''} event</div>
    <div class="se-title">${card.title || ''}</div>
    <div class="se-team">↳ ${team.brandName || ''}</div>
    <div class="se-effects">${pills}</div>`;
}

// ── Rotation ──────────────────────────────────────────────────
function resetTimer() {
  clearInterval(rotateTimer);
  rotateTimer = setInterval(nextSlide, 12000);
}
function nextSlide() {
  if (!slides.length) return;
  currentSlide = (currentSlide + 1) % slides.length;
  renderCurrentSlide();
}
function prevSlide() {
  if (!slides.length) return;
  currentSlide = (currentSlide - 1 + slides.length) % slides.length;
  renderCurrentSlide();
  resetTimer();
}
function goToSlide(i) {
  currentSlide = i;
  renderCurrentSlide();
  resetTimer();
}

// ── Dots ──────────────────────────────────────────────────────
function renderDots() {
  document.getElementById('dots').innerHTML = slides.map((_,i) =>
    `<div class="dot${i===currentSlide?' active':''}" onclick="goToSlide(${i})"></div>`
  ).join('');
}
function updateDots() {
  document.querySelectorAll('.dot').forEach((d,i) => {
    d.classList.toggle('active', i === currentSlide % slides.length);
  });
}

  return d[name] || 'The market is active.';
}

// ── Phase transition overlay ──────────────────────────────────
function checkPhaseTransition() {
  const pt = seasonData?.phaseTransition;
  if (!pt || pt.timestamp === lastTransitionTs) return;
  lastTransitionTs = pt.timestamp;

  const quote = PHASE_QUOTES[(pt.phase - 1) % PHASE_QUOTES.length];
  const overlay = document.getElementById('phaseOverlay');
  const iconEl  = document.getElementById('poIcon');
  if (iconEl) iconEl.src = 'img/phase' + pt.phase + '.svg';
  document.getElementById('poLabel').textContent = 'Phase ' + pt.phase + ' Begins';
  document.getElementById('poName').textContent  = pt.name;
  document.getElementById('poQuote').textContent = quote;
  overlay.style.background = (pt.color || '#0a0a0b') + 'f0';
  overlay.style.color = '#fff';
  overlay.style.display = 'flex';
  overlay.classList.remove('hiding');

  setTimeout(() => {
    overlay.classList.add('hiding');
    setTimeout(() => { overlay.style.display = 'none'; }, 600);
  }, 8000);
}

// ── Keyboard nav ──────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') { nextSlide(); resetTimer(); }
  if (e.key === 'ArrowLeft')  { prevSlide(); }
  if (e.key === 'Escape')     {
    document.getElementById('phaseOverlay').style.display = 'none';
  }
});
</script>
